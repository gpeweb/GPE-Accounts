<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Power Engineering LTD | Accounts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Sora:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --teal-900:#0b3b46;
  --teal-700:#0f5c6b;
  --teal-500:#157a8c;
  --lime-500:#7cb928;
  --lime-400:#96d13a;
  --amber-500:#f5a623;
  --orange-600:#e8791a;
  --red-600:#c0392b;
  --ink-900:#16232a;
  --ink-600:#4a5b63;
  --ink-400:#7c8b92;
  --paper:#f4f7f6;
  --paper-card:#ffffff;
  --line:#e2e8e6;
  --ok:#2e8b57;
  --bad:#c0392b;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Hind Siliguri','Segoe UI',sans-serif;
  background:var(--paper);
  color:var(--ink-900);
  min-height:100vh;
}
h1,h2,h3,.display{font-family:'Sora','Hind Siliguri',sans-serif;}
.num{font-family:'IBM Plex Mono','Hind Siliguri',monospace; font-variant-numeric:tabular-nums;}
button{font-family:inherit; cursor:pointer;}
a{color:inherit;}

/* ===== Layout ===== */
#app{display:flex; min-height:100vh;}
.sidebar{
  width:250px; flex-shrink:0;
  background:linear-gradient(180deg,var(--teal-900) 0%, #0a2e37 100%);
  color:#eaf3f2;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.brand{
  padding:22px 20px 16px 20px;
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex; align-items:center; gap:12px;
}
.brand-mark{width:38px;height:38px;flex-shrink:0;}
.brand-text{line-height:1.15;}
.brand-text .name{font-family:'Sora',sans-serif; font-weight:700; font-size:14px; letter-spacing:.2px;}
.brand-text .tag{font-size:10.5px; color:var(--lime-400); font-weight:600; letter-spacing:.4px; margin-top:2px;}

.nav{padding:14px 10px; flex:1;}
.nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:#7fa3a3; padding:14px 12px 6px;}
.nav-item{
  display:flex; align-items:center; gap:10px;
  padding:10px 12px; border-radius:9px; margin-bottom:2px;
  font-size:14px; font-weight:500; color:#cfe4e2;
  border-left:3px solid transparent;
  transition:background .15s, color .15s;
}
.nav-item:hover{background:rgba(255,255,255,0.06); color:#fff;}
.nav-item.active{background:rgba(124,185,40,0.16); color:#fff; border-left-color:var(--lime-500);}
.nav-item .ic{width:18px; text-align:center; opacity:.9;}
.sidebar-foot{padding:14px 18px; font-size:11px; color:#6f9494; border-top:1px solid rgba(255,255,255,.08);}
.user-badge{padding:14px 18px; border-top:1px solid rgba(255,255,255,.08);}
.user-badge .ub-name{font-weight:700; font-size:13.5px; color:#fff;}
.user-badge .ub-role{font-size:11px; color:var(--lime-400); font-weight:600; margin-top:2px;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  min-height:64px; background:var(--paper-card); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; padding:10px 26px;
  position:sticky; top:0; z-index:20; flex-wrap:wrap; gap:10px;
}
.topbar h1{font-size:19px; margin:0; font-weight:700; color:var(--ink-900);}
.topbar .sub{font-size:12.5px; color:var(--ink-400); margin-top:1px;}
.topbar-actions{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
.topbar-left{display:flex; align-items:center; gap:10px;}

.menu-toggle{
  display:none; background:none; border:1px solid var(--line); border-radius:9px;
  font-size:19px; color:var(--ink-900); padding:6px 11px; align-items:center; justify-content:center;
  flex-shrink:0;
}
.sidebar-overlay{display:none; position:fixed; inset:0; background:rgba(11,20,24,0.5); z-index:45;}
.sidebar-overlay.show{display:block;}

.content{padding:24px 26px 60px; max-width:1300px; width:100%; margin:0 auto;}

/* ===== Responsive: tablet & mobile ===== */
@media(max-width:960px){
  .sidebar{
    position:fixed; left:0; top:0; z-index:50;
    transform:translateX(-100%);
    transition:transform .22s ease;
    width:82vw; max-width:280px;
  }
  .sidebar.open{transform:translateX(0); box-shadow:0 0 50px rgba(0,0,0,.35);}
  .menu-toggle{display:inline-flex;}
  .content{padding:18px 14px 50px;}
  .topbar{padding:10px 14px;}
  .topbar h1{font-size:17px;}
}
@media(max-width:600px){
  .topbar{flex-direction:column; align-items:flex-start;}
  .topbar-actions{width:100%;}
  .topbar-actions .btn, .topbar-actions label.btn{flex:1 1 auto; justify-content:center;}
  .grid-4, .grid-3, .grid-2{grid-template-columns:1fr;}
  .stat-card .value{font-size:21px;}
  .field-row{grid-template-columns:1fr;}
  .filter-bar{flex-direction:column; align-items:stretch;}
  .filter-bar select, .filter-bar input{width:100%;}
  .proj-nums{flex-wrap:wrap; gap:12px 18px;}
  .modal{max-width:100%; border-radius:14px;}
  table{font-size:12.5px;}
  thead th, tbody td{padding:9px 10px;}
}
@media(max-width:400px){
  .brand-text .name{font-size:12.5px;}
  .lang-toggle button{padding:6px 9px; font-size:11.5px;}
}

/* ===== Lang toggle ===== */
.lang-toggle{display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden;}
.lang-toggle button{
  padding:7px 12px; border:none; background:#fff; font-size:12.5px; font-weight:700; color:var(--ink-600);
}
.lang-toggle button.active{background:var(--teal-700); color:#fff;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 16px; border-radius:9px; border:1px solid transparent;
  font-size:13.5px; font-weight:600; background:var(--paper-card); color:var(--ink-900);
  border:1px solid var(--line);
  transition:transform .08s, box-shadow .15s;
}
.btn:hover{box-shadow:0 2px 10px rgba(15,92,107,0.08);}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal-700); color:#fff; border-color:var(--teal-700);}
.btn-primary:hover{background:var(--teal-500);}
.btn-accent{background:var(--lime-500); color:#0b3b46; border-color:var(--lime-500);}
.btn-excel{background:#1d7a46; color:#fff; border-color:#1d7a46;}
.btn-excel:hover{background:#249456;}
.btn-danger{background:#fff; color:var(--red-600); border-color:#f2c9c4;}
.btn-danger:hover{background:#fdf2f1;}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-600);}
.btn-sm{padding:6px 11px; font-size:12.5px; border-radius:7px;}
.btn:disabled{opacity:.45; cursor:not-allowed;}

/* ===== Cards / Grid ===== */
.grid{display:grid; gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:680px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{
  background:var(--paper-card); border:1px solid var(--line); border-radius:14px;
  padding:18px 20px;
}
.stat-card{position:relative; overflow:hidden;}
.stat-card .label{font-size:12px; color:var(--ink-400); font-weight:600; letter-spacing:.3px;}
.stat-card .value{font-size:25px; font-weight:700; margin-top:6px; font-family:'IBM Plex Mono',monospace;}
.stat-card .delta{font-size:11.5px; margin-top:6px; font-weight:600;}
.stat-card .bolt{position:absolute; right:-10px; top:-14px; width:70px; height:110px; opacity:.08; transform:rotate(8deg);}
.stat-teal{border-top:3px solid var(--teal-500);}
.stat-lime{border-top:3px solid var(--lime-500);}
.stat-amber{border-top:3px solid var(--amber-500);}
.stat-red{border-top:3px solid var(--red-600);}

.section-title{display:flex; align-items:center; justify-content:space-between; margin:28px 0 12px; flex-wrap:wrap; gap:8px;}
.section-title h2{font-size:16px; margin:0; font-weight:700;}
.section-title .eyebrow{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; color:var(--lime-500); font-weight:700; margin-bottom:3px;}

/* ===== Table ===== */
.table-wrap{background:var(--paper-card); border:1px solid var(--line); border-radius:14px; overflow:hidden; overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:left; padding:11px 16px; background:#f7faf9; color:var(--ink-600);
  font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px;
  border-bottom:1px solid var(--line); white-space:nowrap;
}
tbody td{padding:11px 16px; border-bottom:1px solid #eef2f1; vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafcfb;}
.amt{font-family:'IBM Plex Mono',monospace; font-weight:600; text-align:right;}
.amt.pos{color:var(--ok);}
.amt.neg{color:var(--bad);}
.tag{display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; white-space:nowrap;}
.tag-income{background:#e6f4ea; color:#227a48;}
.tag-expense{background:#fbe9e7; color:#b5432f;}
.tag-transfer{background:#eaf1fb; color:#2c5fa8;}
.tag-bank{background:#e7f2f5; color:var(--teal-700);}
.tag-cash{background:#fff3e0; color:var(--orange-600);}
.empty-row td{text-align:center; padding:34px; color:var(--ink-400);}

/* ===== Progress ===== */
.progress-bar{height:7px; border-radius:6px; background:#e7ede9; overflow:hidden; margin-top:8px;}
.progress-fill{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--lime-500),var(--teal-500));}

/* ===== Forms / Modal ===== */
.modal-overlay{
  position:fixed; inset:0; background:rgba(11,59,70,0.45); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal{
  background:#fff; border-radius:16px; width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
  box-shadow:0 20px 60px rgba(0,0,0,0.25);
}
.modal-head{padding:18px 22px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
.modal-head h3{margin:0; font-size:16px; font-weight:700;}
.modal-body{padding:20px 22px;}
.modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px;}
.close-x{background:none; border:none; font-size:20px; color:var(--ink-400); line-height:1;}

.field{margin-bottom:14px;}
.field label{display:block; font-size:12.5px; font-weight:600; color:var(--ink-600); margin-bottom:6px;}
.field input, .field select, .field textarea{
  width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:9px;
  font-size:13.5px; font-family:inherit; background:#fbfdfc;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--lime-500); outline-offset:0; border-color:var(--lime-500);}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.hint{font-size:11.5px; color:var(--ink-400); margin-top:5px;}
.radio-row{display:flex; gap:10px;}
.radio-chip{flex:1; text-align:center; padding:9px; border:1px solid var(--line); border-radius:9px; font-size:13px; font-weight:600; color:var(--ink-600);}
.radio-chip input{display:none;}
.radio-chip.checked{border-color:var(--teal-500); background:#eaf5f4; color:var(--teal-700);}

/* ===== Filters ===== */
.filter-bar{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; align-items:center;}
.filter-bar select, .filter-bar input{
  padding:8px 12px; border:1px solid var(--line); border-radius:9px; font-size:13px; background:#fff; font-family:inherit;
}

/* ===== Project cards ===== */
.proj-card{border-radius:14px; border:1px solid var(--line); background:#fff; padding:18px 20px; position:relative;}
.proj-card .top{display:flex; justify-content:space-between; align-items:flex-start;}
.proj-card .pname{font-weight:700; font-size:15px;}
.proj-card .pclient{font-size:12px; color:var(--ink-400); margin-top:2px;}
.status-pill{font-size:10.5px; font-weight:700; padding:3px 10px; border-radius:20px; white-space:nowrap;}
.status-running{background:#e6f4ea; color:#227a48;}
.status-done{background:#eef1f0; color:#5b6b66;}
.status-hold{background:#fff3e0; color:var(--orange-600);}
.proj-nums{display:flex; gap:18px; margin-top:14px;}
.proj-nums div .l{font-size:11px; color:var(--ink-400);}
.proj-nums div .v{font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14.5px; margin-top:2px;}

.empty-state{text-align:center; padding:60px 20px; color:var(--ink-400);}
.empty-state .big-ic{font-size:40px; margin-bottom:10px;}

.toast{
  position:fixed; bottom:24px; right:24px; background:var(--ink-900); color:#fff;
  padding:12px 18px; border-radius:10px; font-size:13.5px; z-index:200; box-shadow:0 10px 30px rgba(0,0,0,.25);
  display:flex; align-items:center; gap:8px; max-width:320px;
}

.crumb{font-size:12.5px; color:var(--ink-400); margin-bottom:4px;}
.crumb a{color:var(--teal-500); font-weight:600;}

.auth-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,var(--teal-900),#0a2e37 60%); padding:20px;}
.auth-card{background:#fff; border-radius:18px; padding:36px 32px; width:100%; max-width:380px; box-shadow:0 30px 80px rgba(0,0,0,0.35);}
.auth-card .field{margin-bottom:14px;}

.spinner{width:34px; height:34px; border-radius:50%; border:3px solid rgba(255,255,255,0.25); border-top-color:#fff; animation:spin 0.8s linear infinite; margin:0 auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-wrap{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:linear-gradient(135deg,var(--teal-900),#0a2e37 60%); color:#eaf3f2; font-size:13.5px;}

::-webkit-scrollbar{width:9px; height:9px;}
::-webkit-scrollbar-thumb{background:#c7d5d2; border-radius:10px;}
</style>
</head>

function L(key, vars){
  const row = DICT[key];
  let s = row ? (row[LANG] || row.bn || key) : key;
  if(vars){ Object.keys(vars).forEach(k=>{ s = s.replace("{"+k+"}", vars[k]); }); }
  return s;
}
function setLang(l){
  LANG = l;
  try{ localStorage.setItem(LANG_KEY, l); }catch(e){}
  render();
}

function fmt(n){
  n = Number(n)||0;
  const neg = n < 0;
  n = Math.abs(n);
  const s = n.toLocaleString('en-IN', {maximumFractionDigits:0});
  return (neg?"-":"") + CURRENCY + s;
}
function fmtDate(d){
  if(!d) return "-";
  const dt = new Date(d+"T00:00:00");
  const monthsBn=["জান","ফেব","মার্চ","এপ্রি","মে","জুন","জুলা","আগ","সেপ্টে","অক্টো","নভে","ডিসে"];
  const monthsEn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const months = LANG==='en'? monthsEn : monthsBn;
  return dt.getDate()+" "+months[dt.getMonth()]+" "+dt.getFullYear();
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function statusLabel(status){
  return status==='done'? L('status_done') : status==='hold'? L('status_hold') : L('status_running');
}
function typeLabel(type){
  return type==='income'? L('income') : type==='expense'? L('expense') : type==='withdrawal'? L('withdrawal') : L('transfer');
}
function isRealExpense(t){
  // a withdrawal that has a receiver account (e.g. moved into office cash)
  // is an internal transfer, not real spending, so it's excluded here
  if(t.type==='expense') return true;
  if(t.type==='withdrawal') return !(t.toAccountType && t.toAccountId);
  return false;
}
function projectCodeLabel(p){
  if(!p || p.projectCode==null) return "";
  return "GPE-" + String(p.projectCode).padStart(4,'0');
}
function findProjectByCodeOrName(query){
  const q = String(query).trim().toLowerCase();
  if(!q) return null;
  const numMatch = q.replace(/^gpe-?/,'').replace(/^0+/,'') || "0";
  return DB.projects.find(p=>{
    if(p.projectCode!=null && String(p.projectCode)===numMatch) return true;
    if(projectCodeLabel(p).toLowerCase()===q) return true;
    return false;
  }) || null;
}

      SB.from("transactions").select("*"),
      SB.from("profiles").select("*"),
      SB.from("categories").select("*")
    ]);
    if(companyRes.error) throw companyRes.error;
    if(projRes.error) throw projRes.error;
    if(bankRes.error) throw bankRes.error;
    if(cashRes.error) throw cashRes.error;
    if(txnRes.error) throw txnRes.error;
    if(profRes.error) throw profRes.error;
    if(catRes.error) throw catRes.error;

    const cr = companyRes.data || {};
    DB.company = { name: cr.name || "General Power Engineering LTD", tagline: cr.tagline || "Trusted In Power Distribution", logo: cr.logo || null };
    DB.projects = (projRes.data||[]).map(mapProjectRow);
    DB.banks = (bankRes.data||[]).map(mapBankRow);
    DB.cash = (cashRes.data||[]).map(mapCashRow);
    DB.transactions = (txnRes.data||[]).map(mapTxnRow);
    DB.users = (profRes.data||[]).map(mapUserRow);
    DB.categories = { income:[], expense:[] };
    (catRes.data||[]).forEach(c=>{ if(DB.categories[c.kind]) DB.categories[c.kind].push(c.name); });
    return true;
  }catch(e){
    console.error("fetchAllData error", e);
    return false;
  }
}

  const ok = await fetchAllData();
  if(!ok){ toast(L('toast_sync_error')); }
  render();
}

async function establishProfileAndData(){

  if(!user) return false;

  return await fetchAllData();
}

async function boot(){
  const cfg = getSbConfig();
  if(!cfg){ APP_STATE = "need_config"; render(); return; }
  initSupabase(cfg.url, cfg.key);
  APP_STATE = "loading"; render();

  const { data:{ session } } = await SB.auth.getSession();
  HAS_SESSION = !!session;

  if(HAS_SESSION){
    const ok = await establishProfileAndData();
    if(!ok){ HAS_SESSION = false; }
  }

    try{
      const { data } = await SB.rpc("any_profile_exists");
      SETUP_NEEDED = !data;

}

let REALTIME_CHANNEL = null;
let realtimeDebounce = null;
function setupRealtimeSync(){
  if(REALTIME_CHANNEL || !SB) return;
  const onChange = ()=>{
    clearTimeout(realtimeDebounce);
    realtimeDebounce = setTimeout(async ()=>{
      await fetchAllData();
      if(!document.getElementById("modalOverlay")) render();
    }, 400);
  };
  REALTIME_CHANNEL = SB.channel("gpe-accounts-sync")
    .on("postgres_changes", {event:"*", schema:"public", table:"projects"}, onChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"bank_accounts"}, onChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"cash_accounts"}, onChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"transactions"}, onChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"categories"}, onChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"profiles"}, onChange)
    .on("postgres_changes", {event:"*", schema:"public", table:"company"}, onChange)
    .subscribe();
}
async function teardownRealtimeSync(){

  REALTIME_CHANNEL = null;
}

/* ---------------- Auth ----------------
   Real Supabase Auth is used under the hood so a leaked anon key alone
   cannot read or write data — a valid logged-in (non-disabled) account
   is required, enforced server-side by RLS. Login still feels like a
   simple username+password to the user: usernames are mapped to a
   generated placeholder email internally (Supabase Auth requires an
   email-shaped identifier). */
function simpleHash(str){
  let h1 = 0xdeadbeef ^ str.length, h2 = 0x41c6ce57 ^ str.length;
  for(let i=0;i<str.length;i++){
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909);
  h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1>>>0)).toString(16);
}
function usernameToEmail(username){
  return "u" + simpleHash(String(username).trim().toLowerCase()) + "@gpe-accounts.local";
}

/* ---------------- Computations ---------------- */
function accountBalance(type, id){
  const acc = (type==="bank"? DB.banks: DB.cash).find(a=>a.id===id);
  if(!acc) return 0;
  let bal = Number(acc.opening)||0;
  DB.transactions.forEach(t=>{
    if(t.type==="transfer"){
      if(t.accountType===type && t.accountId===id) bal -= Number(t.amount);
      if(t.toAccountType===type && t.toAccountId===id) bal += Number(t.amount);
    } else if(t.type==="withdrawal" && t.toAccountType && t.toAccountId){
      if(t.accountType===type && t.accountId===id) bal -= Number(t.amount);
      if(t.toAccountType===type && t.toAccountId===id) bal += Number(t.amount);
    } else if(t.accountType===type && t.accountId===id){
      bal += (t.type==="income"? Number(t.amount) : -Number(t.amount));
    }
  });
  return bal;
}
function totalBankBalance(){ return DB.banks.reduce((s,b)=>s+accountBalance("bank",b.id),0); }
function totalCashBalance(){ return DB.cash.reduce((s,c)=>s+accountBalance("cash",c.id),0); }

function companyTotals(){
  let income=0, expense=0;
  DB.transactions.forEach(t=>{
    if(t.type==="income") income += Number(t.amount);
    if(isRealExpense(t)) expense += Number(t.amount);
  });
  return {income, expense, net: income-expense};
}
function projectTotals(projectId){
  let income=0, expense=0;
  DB.transactions.filter(t=>t.projectId===projectId).forEach(t=>{
    if(t.type==="income") income += Number(t.amount);
    if(isRealExpense(t)) expense += Number(t.amount);
  });
  return {income, expense, net: income-expense};
}
function isOfficeExpenseEntry(t){
  // blank-project entries that are really a withdrawal parked into a cash
  // account aren't "office expense" — they're just an internal transfer
  return !t.projectId && !(t.toAccountType && t.toAccountId);
}
function officeExpenseTotals(){
  let income=0, expense=0;
  DB.transactions.filter(isOfficeExpenseEntry).forEach(t=>{
    if(t.type==="income") income += Number(t.amount);
    if(isRealExpense(t)) expense += Number(t.amount);
  });
  return {income, expense, net: income-expense};
}
function projectName(id){ const p = DB.projects.find(p=>p.id===id); return p? p.name : L('general_company'); }
function accountName(type,id){
  const list = type==="bank"? DB.banks : DB.cash;
  const a = list.find(x=>x.id===id);
  return a? a.name : "-";
}

   ==================================================================== */
function exportAllReportsExcel(){
  if(typeof XLSX === 'undefined'){ toast(L('toast_excel_lib_missing')); return; }
  const wb = XLSX.utils.book_new();

  // Summary sheet
  const tot = companyTotals();
  const summaryRows = [
    [L('xl_metric'), L('xl_value')],
    [L('total_income'), tot.income],
    [L('total_expense'), tot.expense],
    [L('net_profit'), tot.net],
    [L('xl_total_bank_balance'), totalBankBalance()],
    [L('xl_total_cash_balance'), totalCashBalance()],
    [],
    [L('xl_generated_on'), fmtDate(todayStr())]
  ];
  const wsSummary = XLSX.utils.aoa_to_sheet(summaryRows);
  wsSummary['!cols'] = [{wch:26},{wch:20}];
  XLSX.utils.book_append_sheet(wb, wsSummary, L('xl_sheet_summary'));

  // Projects sheet
  const projRows = [[L('col_project_code'), L('col_project'), L('col_client'), L('col_status'), L('col_budget'), L('total_income'), L('total_expense'), L('net')]];
  DB.projects.forEach(p=>{
    const t = projectTotals(p.id);
    projRows.push([projectCodeLabel(p), p.name, p.client||'', statusLabel(p.status), Number(p.budget)||0, t.income, t.expense, t.net]);
  });
  const wsProj = XLSX.utils.aoa_to_sheet(projRows);
  wsProj['!cols'] = [{wch:12},{wch:32},{wch:22},{wch:12},{wch:14},{wch:14},{wch:14},{wch:14}];
  XLSX.utils.book_append_sheet(wb, wsProj, L('xl_sheet_projects'));

  // Bank accounts sheet
  const bankRows = [[L('col_account_name'), L('col_bank_name'), L('col_branch'), L('col_acc_no'), L('col_opening'), L('col_current_balance')]];
  DB.banks.forEach(b=> bankRows.push([b.name, b.bankName||'', b.branch||'', b.accNo||'', Number(b.opening)||0, accountBalance('bank',b.id)]));
  const wsBank = XLSX.utils.aoa_to_sheet(bankRows);
  wsBank['!cols'] = [{wch:24},{wch:26},{wch:18},{wch:20},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsBank, L('xl_sheet_banks'));

  // Cash accounts sheet
  const cashRows = [[L('col_account_name'), L('col_opening'), L('col_current_balance')]];
  DB.cash.forEach(c=> cashRows.push([c.name, Number(c.opening)||0, accountBalance('cash',c.id)]));
  const wsCash = XLSX.utils.aoa_to_sheet(cashRows);
  wsCash['!cols'] = [{wch:24},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsCash, L('xl_sheet_cash'));

  // All transactions sheet
  const txnRows = [[L('col_date'), L('col_type'), L('col_project'), L('col_account'), L('col_category'), L('col_description'), L('col_voucher_no'), L('col_method'), L('col_cheque_no'), L('col_cheque_bank'), L('col_withdrawn_by'), L('col_amount'), L('col_created_by')]];
  [...DB.transactions].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>{
    let accStr = accountName(t.accountType, t.accountId);
    if(t.type==='transfer' || (t.type==='withdrawal' && t.toAccountType && t.toAccountId)){ accStr += " -> " + accountName(t.toAccountType, t.toAccountId); }
    const signedAmount = (isRealExpense(t))? -Number(t.amount) : Number(t.amount);
    const methodStr = t.method==='cheque'? L('cheque_method') : (t.method==='bank_transfer'? L('bank_transfer_method') : (t.method==='cash'? L('cash_method') : ''));
    txnRows.push([t.date, typeLabel(t.type), projectName(t.projectId), accStr, t.category||'', t.desc||'', t.voucherNo||'', methodStr, t.chequeNo||'', t.chequeBankName||'', t.withdrawnBy||'', signedAmount, t.createdBy||'']);
  });
  const wsTxn = XLSX.utils.aoa_to_sheet(txnRows);
  wsTxn['!cols'] = [{wch:12},{wch:10},{wch:30},{wch:26},{wch:18},{wch:34},{wch:16},{wch:12},{wch:14},{wch:20},{wch:20},{wch:14},{wch:16}];
  XLSX.utils.book_append_sheet(wb, wsTxn, L('xl_sheet_txns'));

  const companyPart = (DB.company.name||"GPE").replace(/[^a-zA-Z0-9]+/g,"_").slice(0,30);
  XLSX.writeFile(wb, `${companyPart}_Reports_${todayStr()}.xlsx`);
  toast(L('toast_excel_exported'));
}

}

function rowTxn(t, opts={}){
  const typeTag = t.type==="income"? `<span class="tag tag-income">${L('income')}</span>`
    : t.type==="expense"? `<span class="tag tag-expense">${L('expense')}</span>`
    : t.type==="withdrawal"? `<span class="tag tag-expense">${L('withdrawal')}</span>`
    : `<span class="tag tag-transfer">${L('transfer')}</span>`;
  const accTag = `<span class="tag ${t.accountType==='bank'?'tag-bank':'tag-cash'}">${accountName(t.accountType,t.accountId)}</span>`;
  const amtClass = t.type==="income"?"pos": (t.type==="expense"||t.type==="withdrawal")?"neg":"";
  const sign = t.type==="income"?"+": (t.type==="expense"||t.type==="withdrawal")?"-":"";
  const hasPending = !!t.pendingEdit;
  const editStatusTag = hasPending
    ? `<div class="hint" style="margin-top:2px; color:var(--orange-600); font-weight:600;">⏳ ${L('pending_edit_tag')} (${t.pendingEditBy})</div>`
    : (t.isEdited? `<div class="hint" style="margin-top:2px;">✎ ${L('edited_tag')}: ${t.lastEditedBy}${t.lastApprovedBy && t.lastApprovedBy!==t.lastEditedBy? (' · '+L('approved_by_short')+': '+t.lastApprovedBy):''}</div>` : "");
  const actionButtons = (hasPending && isAdmin())
    ? `<button class="btn btn-ghost btn-sm" data-approve-edit="${t.id}" style="color:var(--ok)" title="${L('approve_btn')}">✓</button>
       <button class="btn btn-ghost btn-sm" data-reject-edit="${t.id}" style="color:var(--red-600)" title="${L('reject_btn')}">✕</button>`
    : `<button class="btn btn-ghost btn-sm" data-edit-txn="${t.id}">✎</button>
       <button class="btn btn-ghost btn-sm" data-del-txn="${t.id}" style="color:var(--red-600)">🗑</button>`;
  const voucherHint = t.voucherNo? `<div class="hint" style="margin-top:2px;">${(t.type==='income'?L('cash_receipt_no_short'):L('voucher_no_short'))}: ${t.voucherNo}</div>` : "";
  return `<tr>
    <td>${fmtDate(t.date)}</td>
    <td>${typeTag}</td>
    ${opts.showProject? `<td>${projectName(t.projectId)}</td>`:""}
    <td>${accTag}${(t.type==='transfer' || (t.type==='withdrawal' && t.toAccountType && t.toAccountId))?` → <span class="tag ${t.toAccountType==='bank'?'tag-bank':'tag-cash'}">${accountName(t.toAccountType,t.toAccountId)}</span>`:""}</td>
    <td>${t.category||"-"}</td>
    <td style="color:var(--ink-600)">${t.desc||""}${(t.chequeNo||t.withdrawnBy||t.chequeBankName||t.method==='bank_transfer')?`<div class="hint" style="margin-top:3px;">${t.method==='cheque'?(L('cheque_method')+' · '):''}${t.method==='bank_transfer'?(L('bank_transfer_method')+' · '):''}${t.chequeNo?(L('cheque_no_short')+': '+t.chequeNo+' '):''}${t.chequeBankName?('('+L('cheque_bank_short')+': '+t.chequeBankName+') '):''}${t.withdrawnBy?(L('withdrawn_by_short')+': '+t.withdrawnBy):''}</div>`:""}${voucherHint}${t.createdBy?`<div class="hint" style="margin-top:2px;">${L('created_by_short')}: ${t.createdBy}</div>`:""}${editStatusTag}</td>
    <td class="amt ${amtClass}">${sign}${fmt(t.amount)}</td>
    <td style="text-align:right; white-space:nowrap;">
      ${actionButtons}
    </td>
  </tr>`;
}

/* ---------------- Transactions (global ledger) ---------------- */
function applyFilters(list){
  return list.filter(t=>{
    if(FILTERS.type && t.type!==FILTERS.type) return false;
    if(FILTERS.projectId==="__company__" && !isOfficeExpenseEntry(t)) return false;
    if(FILTERS.projectId && FILTERS.projectId!=="__company__" && t.projectId!==FILTERS.projectId) return false;
    if(FILTERS.accountType && t.accountType!==FILTERS.accountType) return false;
    if(FILTERS.accountId && t.accountId!==FILTERS.accountId) return false;
    if(FILTERS.from && t.date < FILTERS.from) return false;
    if(FILTERS.to && t.date > FILTERS.to) return false;
    if(FILTERS.q){
      const q = FILTERS.q.toLowerCase();
      const hay = (t.desc||"")+" "+(t.category||"")+" "+(t.voucherNo||"")+" "+(t.chequeNo||"");
      if(!hay.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function categoryBreakdown(){
  const map = {};
  DB.transactions.filter(t=>isRealExpense(t)).forEach(t=>{

    map[cat] = (map[cat]||0) + Number(t.amount);

  const entries = Object.entries(map).sort((a,b)=>b[1]-a[1]);
  const max = entries.length? entries[0][1] : 1;
  if(entries.length===0) return `<div class="card empty-state">${L('no_expense_found')}</div>`;
  return `<div class="card">
    ${entries.map(([cat,amt])=>`

      ${existing && !isAdmin()? `<p class="hint" style="background:#fff3e0; padding:8px 10px; border-radius:8px; margin-top:0;">${L('non_admin_edit_note')}</p>`:""}
      ${existing && existing.pendingEdit? `<p class="hint" style="background:#fff3e0; padding:8px 10px; border-radius:8px; margin-top:0;">${L('overwrite_pending_note')}</p>`:""}
      <div class="field-row">
        <div class="field"><label id="tfAccLabel">${L('account_from_to')}</label>
          <select id="tfAccType">
            <option value="bank" ${t.accountType==='bank'?'selected':''}>${L('bank_label')}</option>
            <option value="cash" ${t.accountType==='cash'?'selected':''}>${L('cash_label')}</option>
          </select>
        </div>
        <div class="field"><label>&nbsp;</label>
          <select id="tfAccount"></select>
        </div>
      </div>
      <div class="field" id="tfTypeWrap"></div>
      <div class="field-row">
        <div class="field"><label>${L('date_label')}</label><input type="date" id="tfDate" value="${t.date}"></div>
        <div class="field"><label>${L('amount_bdt_req')}</label><input type="number" id="tfAmount" value="${t.amount}" placeholder="0"></div>
      </div>
      <div class="field" id="tfProjectWrap">
        <label id="tfProjectLabel">${L('project_optional')}</label>
        <select id="tfProject"></select>
      </div>
      <div class="field-row" id="tfToWrap" style="display:none;">
        <div class="field"><label>${L('recipient_acc_type')}</label>
          <select id="tfToType">
            <option value="bank" ${t.toAccountType==='bank'?'selected':''}>${L('bank_label')}</option>
            <option value="cash" ${t.toAccountType==='cash'?'selected':''}>${L('cash_label')}</option>
          </select>
        </div>
        <div class="field"><label>${L('recipient_account')}</label>
          <select id="tfToAccount"></select>
        </div>
      </div>
      <div class="field" id="tfCatWrap">
        <label>${L('category_label')}</label>
        <select id="tfCategory"></select>
      </div>
      <div class="field"><label>${L('description_label')}</label><input id="tfDesc" value="${t.desc||''}" placeholder="${L('description_ph')}"></div>
      <div class="field" id="tfVoucherWrap" style="display:none;">
        <label id="tfVoucherLabel">${L('cash_receipt_no_label')}</label><input id="tfVoucherNo" value="${t.voucherNo||''}" placeholder="${L('cash_receipt_no_ph')}">
      </div>
      <div class="field" id="tfMethodWrap" style="display:none;">
        <label>${L('payment_method')}</label>
        <div class="radio-row">
          <label class="radio-chip ${(t.method!=='cheque'&&t.method!=='bank_transfer')?'checked':''}"><input type="radio" name="txMethod" value="cash" ${(t.method!=='cheque'&&t.method!=='bank_transfer')?'checked':''}>${L('cash_method')}</label>
          <label class="radio-chip ${t.method==='bank_transfer'?'checked':''}" id="tfMethodBankChip" style="display:none;"><input type="radio" name="txMethod" value="bank_transfer" ${t.method==='bank_transfer'?'checked':''}>${L('bank_transfer_method')}</label>
          <label class="radio-chip ${t.method==='cheque'?'checked':''}"><input type="radio" name="txMethod" value="cheque" ${t.method==='cheque'?'checked':''}>${L('cheque_method')}</label>
        </div>
      </div>
      <div class="field-row" id="tfInChequeWrap" style="display:none;">
        <div class="field"><label>${L('cheque_no_label')}</label><input id="tfInChequeNo" value="${t.chequeNo||''}" placeholder="${L('cheque_no_ph')}"></div>
        <div class="field"><label>${L('cheque_bank_name_label')}</label><input id="tfInChequeBank" value="${t.chequeBankName||''}" placeholder="${L('cheque_bank_name_ph')}"></div>
      </div>
      <div class="field-row" id="tfChequeWrap" style="display:none;">
        <div class="field"><label>${L('withdrawal_cheque_no_label')}</label><input id="tfChequeNo" value="${t.chequeNo||''}" placeholder="${L('cheque_no_ph')}"></div>
        <div class="field"><label>${L('withdrawn_by_label')}</label><input id="tfWithdrawnBy" value="${t.withdrawnBy||''}" placeholder="${L('withdrawn_by_ph')}"></div>
      </div>
      <p class="hint" id="tfWithdrawalNote" style="display:none;">${L('withdrawal_note')}</p>
    </div>
    <div class="modal-foot">
      <button class="btn" id="mCancel">${L('cancel')}</button>
      <button class="btn btn-primary" id="tfSave">${L('save')}</button>
    </div>
  `, (overlay)=>{
    const accTypeSel = overlay.querySelector("#tfAccType");
    const accSel = overlay.querySelector("#tfAccount");
    const toTypeSel = overlay.querySelector("#tfToType");
    const toAccSel = overlay.querySelector("#tfToAccount");
    const catSel = overlay.querySelector("#tfCategory");
    const catWrap = overlay.querySelector("#tfCatWrap");
    const toWrap = overlay.querySelector("#tfToWrap");
    const projWrap = overlay.querySelector("#tfProjectWrap");
    const projectSel = overlay.querySelector("#tfProject");
    const projectLabel = overlay.querySelector("#tfProjectLabel");
    const chequeWrap = overlay.querySelector("#tfChequeWrap");
    const methodWrap = overlay.querySelector("#tfMethodWrap");
    const inChequeWrap = overlay.querySelector("#tfInChequeWrap");
    const voucherWrap = overlay.querySelector("#tfVoucherWrap");
    const withdrawalNote = overlay.querySelector("#tfWithdrawalNote");
    const typeWrap = overlay.querySelector("#tfTypeWrap");

    let currentType = initialType;
    let initialReceiverValue = t.projectId || (t.toAccountType==='cash' && t.toAccountId? ('cash:'+t.toAccountId) : "");

    function refreshReceiverOptions(){
      const prevVal = projectSel.options.length? projectSel.value : initialReceiverValue;
      let html = `<option value="">${L('general_company')}</option>`;
      html += DB.projects.map(p=>`<option value="${p.id}">${p.name}</option>`).join("");
      if(currentType==='withdrawal'){
        html += DB.cash.map(c=>`<option value="cash:${c.id}">💵 ${c.name}</option>`).join("");
      }
      projectSel.innerHTML = html;
      projectSel.value = prevVal;
      if(projectLabel) projectLabel.textContent = currentType==='withdrawal'? L('receiver_label') : L('project_optional');
    }

    function renderTypeRadio(){
      const allowed = typesForAccount(accTypeSel.value);
      if(!allowed.includes(currentType)) currentType = allowed[0];
      typeWrap.innerHTML = `
        <label>${L('type_label')}</label>
        <div class="radio-row">
          ${allowed.map(v=>`<label class="radio-chip ${currentType===v?'checked':''}"><input type="radio" name="txType" value="${v}" ${currentType===v?'checked':''}>${typeChipLabel(v)}</label>`).join("")}
        </div>`;
      typeWrap.querySelectorAll('input[name="txType"]').forEach(r=>{
        r.onchange = ()=>{
          currentType = r.value;
          typeWrap.querySelectorAll('.radio-chip').forEach(c=>c.classList.remove('checked'));
          r.closest('.radio-chip').classList.add('checked');
          refreshCatOptions();
        };
      });
    }

    function refreshAccOptions(){
      accSel.innerHTML = accTypeSel.value==='bank'? bankOpts(t.accountType,t.accountId) : cashOpts(t.accountType,t.accountId);
      if(!accSel.value && accSel.options.length) accSel.selectedIndex = 0;
      renderTypeRadio();
      refreshCatOptions();
    }
    function refreshToOptions(){
      toAccSel.innerHTML = toTypeSel.value==='bank'? bankOpts(t.toAccountType,t.toAccountId) : cashOpts(t.toAccountType,t.toAccountId);
      if(!toAccSel.value && toAccSel.options.length) toAccSel.selectedIndex = 0;
    }
    function refreshChequeVisibility(){
      const isWithdrawal = currentType==='withdrawal';
      chequeWrap.style.display = isWithdrawal? 'grid':'none';
      withdrawalNote.style.display = isWithdrawal? 'block':'none';

      const isIncome = currentType==='income';
      const isExpense = currentType==='expense';
      methodWrap.style.display = isIncome? 'block':'none';
      voucherWrap.style.display = (isIncome || isExpense)? 'block':'none';
      const voucherLabel = overlay.querySelector("#tfVoucherLabel");
      const voucherInput = overlay.querySelector("#tfVoucherNo");
      if(voucherLabel && voucherInput){
        voucherLabel.textContent = isIncome? L('cash_receipt_no_label') : L('voucher_no_label');
        voucherInput.placeholder = isIncome? L('cash_receipt_no_ph') : L('voucher_no_ph');
      }

      const bankChip = overlay.querySelector("#tfMethodBankChip");
      const isBankAccount = accTypeSel.value==='bank';
      if(bankChip){
        bankChip.style.display = isBankAccount? 'inline-flex':'none';
        if(!isBankAccount){
          const bankRadio = overlay.querySelector('input[name="txMethod"][value="bank_transfer"]');
          if(bankRadio && bankRadio.checked){
            const cashRadio = overlay.querySelector('input[name="txMethod"][value="cash"]');
            cashRadio.checked = true;
            overlay.querySelectorAll('#tfMethodWrap .radio-chip').forEach(c=>c.classList.remove('checked'));
            cashRadio.closest('.radio-chip').classList.add('checked');
          }
        }
      }

      const methodEl = overlay.querySelector('input[name="txMethod"]:checked');
      const isCheque = isIncome && methodEl && methodEl.value==='cheque';
      inChequeWrap.style.display = isCheque? 'grid':'none';
    }
    function refreshCatOptions(){
      if(currentType==='transfer'){
        catWrap.style.display='none'; toWrap.style.display='grid'; projWrap.style.display='none';
      } else if(currentType==='withdrawal'){
        catWrap.style.display='block'; toWrap.style.display='none'; projWrap.style.display='block';
        catSel.innerHTML = renderCatOptions('expense');
        refreshReceiverOptions();
      } else {
        catWrap.style.display='block'; toWrap.style.display='none'; projWrap.style.display='block';
        catSel.innerHTML = renderCatOptions(currentType);
        refreshReceiverOptions();
      }
      refreshChequeVisibility();
    }
    renderTypeRadio(); refreshAccOptions(); refreshToOptions(); refreshCatOptions();

    overlay.querySelectorAll('input[name="txMethod"]').forEach(r=>{
      r.onchange = ()=>{
        overlay.querySelectorAll('#tfMethodWrap .radio-chip').forEach(c=>c.classList.remove('checked'));
        r.closest('.radio-chip').classList.add('checked');
        refreshChequeVisibility();
      };
    });

    accTypeSel.onchange = refreshAccOptions;
    toTypeSel.onchange = refreshToOptions;

    overlay.querySelector("#mClose").onclick = closeModal;
    overlay.querySelector("#mCancel").onclick = closeModal;
    overlay.querySelector("#tfSave").onclick = async ()=>{
      const amount = Number(overlay.querySelector("#tfAmount").value);
      if(!amount || amount<=0){ toast(L('toast_valid_amount')); return; }
      const type = currentType;
      const data = {
        date: overlay.querySelector("#tfDate").value || todayStr(),
        type,
        amount,
        desc: overlay.querySelector("#tfDesc").value.trim(),
        voucherNo: (type==='income'||type==='expense')? overlay.querySelector("#tfVoucherNo").value.trim() : "",
        accountType: accTypeSel.value,
        accountId: accSel.value,
      };
      if(type==='transfer'){
        data.toAccountType = toTypeSel.value;
        data.toAccountId = toAccSel.value;
        data.projectId = null; data.category = L('transfer');
        if(data.accountType===data.toAccountType && data.accountId===data.toAccountId){
          toast(L('toast_same_account_transfer')); return;
        }
      } else {
        const rawVal = overlay.querySelector("#tfProject").value;
        if(type==='withdrawal' && rawVal.startsWith('cash:')){
          data.projectId = null;
          data.toAccountType = 'cash';
          data.toAccountId = rawVal.slice(5);
        } else {
          data.projectId = rawVal || null;
          data.toAccountType = null;
          data.toAccountId = null;
        }
        data.category = catSel.value || (DB.categories[type==='withdrawal'?'expense':type][0]||"");
      }
      if(type==='withdrawal'){
        data.chequeNo = overlay.querySelector("#tfChequeNo").value.trim();
        data.withdrawnBy = overlay.querySelector("#tfWithdrawnBy").value.trim();
        data.method = ""; data.chequeBankName = "";
      } else if(type==='income'){
        const methodEl = overlay.querySelector('input[name="txMethod"]:checked');
        data.method = methodEl? methodEl.value : "cash";
        if(data.method==='cheque'){
          data.chequeNo = overlay.querySelector("#tfInChequeNo").value.trim();
          data.chequeBankName = overlay.querySelector("#tfInChequeBank").value.trim();
        } else {
          data.chequeNo = ""; data.chequeBankName = "";
        }
        data.withdrawnBy = "";
      } else {
        data.chequeNo = ""; data.withdrawnBy = ""; data.method = ""; data.chequeBankName = "";
      }
      if(!data.accountId){ toast(L('toast_select_account')); return; }
      const saveBtn = overlay.querySelector("#tfSave"); saveBtn.disabled = true;
      let error;
      const isEditOfExisting = !!existing;
      if(existing){
        stampUpdated(data);
        ({error} = await SB.from("transactions").update(txnToRow({...existing, ...data})).eq("id", existing.id));
      } else {
        stampCreated(data);
        ({error} = await SB.from("transactions").insert(txnToRow(data)));
      }
      saveBtn.disabled = false;
      if(error){ toast(L('toast_sync_error')); console.error(error); return; }
      closeModal(); await refreshAndRender();
      toast((isEditOfExisting && !isAdmin())? L('toast_edit_submitted') : L('toast_txn_saved'));
    };
  });
}

/* ====================================================================
   EVENT BINDING
   ==================================================================== */
function bindGlobalEvents(){
  document.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click", ()=> navigate(el.dataset.nav, el.dataset.id));
  });
  document.querySelectorAll("[data-setlang]").forEach(el=>{
    el.addEventListener("click", ()=> setLang(el.dataset.setlang));
  });

  const menuToggle = document.getElementById("btnMenuToggle");

  if(overlay) overlay.onclick = ()=>{ SIDEBAR_OPEN = false; render(); };

  const qa = document.getElementById("btnQuickAdd");
  if(qa) qa.onclick = ()=> formTransaction(null, {});

  const addProj = document.getElementById("btnAddProject");
  if(addProj) addProj.onclick = ()=> formProject(null);

  const projSearch = document.getElementById("projectSearchInput");
  if(projSearch){

      PROJECT_SEARCH = projSearch.value;

  const officeExpenseCardEl = document.querySelector("[data-office-expense]");

    FILTERS = {type:"",scope:"",projectId:"__company__",accountType:"",accountId:"",from:"",to:"",q:""};
    navigate("transactions");
  });

  const addBank = document.getElementById("btnAddBank");
  if(addBank) addBank.onclick = ()=> formAccount("bank", null);
  const addCash = document.getElementById("btnAddCash");
  if(addCash) addCash.onclick = ()=> formAccount("cash", null);

  document.querySelectorAll("[data-edit-project]").forEach(el=>{
    el.addEventListener("click",(e)=>{ e.stopPropagation(); const p = DB.projects.find(x=>x.id===el.dataset.editProject); formProject(p); });
  });
  document.querySelectorAll("[data-del-project]").forEach(el=>{
    el.addEventListener("click",async (e)=>{ e.stopPropagation();
      if(confirm(L('confirm_del_project'))){
        const id = el.dataset.delProject;
        const { error } = await SB.from("projects").delete().eq("id", id);
        if(error){ toast(L('toast_sync_error')); console.error(error); return; }
        navigate("projects"); await refreshAndRender(); toast(L('toast_project_deleted'));
      }
    });
  });

  document.querySelectorAll("[data-edit-account]").forEach(el=>{
    el.addEventListener("click",(e)=>{ e.stopPropagation(); const [kind,id]=el.dataset.editAccount.split(":");
      const a = (kind==='bank'?DB.banks:DB.cash).find(x=>x.id===id); formAccount(kind,a); });
  });
  document.querySelectorAll("[data-del-account]").forEach(el=>{
    el.addEventListener("click",async (e)=>{ e.stopPropagation(); const [kind,id]=el.dataset.delAccount.split(":");
      if(confirm(L('confirm_del_account'))){
        const table = kind==='bank'? "bank_accounts" : "cash_accounts";
        const { error } = await SB.from(table).delete().eq("id", id);
        if(error){ toast(L('toast_sync_error')); console.error(error); return; }
        navigate(kind); await refreshAndRender(); toast(L('toast_account_deleted'));
      }
    });
  });

  document.querySelectorAll("[data-add-txn-project]").forEach(el=>{
    el.addEventListener("click",()=> formTransaction(null, {projectId: el.dataset.addTxnProject}));
  });
  document.querySelectorAll("[data-add-txn-account]").forEach(el=>{
    el.addEventListener("click",()=>{ const [kind,id]=el.dataset.addTxnAccount.split(":"); formTransaction(null,{accountType:kind, accountId:id}); });
  });
  document.querySelectorAll("[data-add-txn-office]").forEach(el=>{
    el.addEventListener("click",()=> formTransaction(null, {}));
  });
  document.querySelectorAll("[data-edit-txn]").forEach(el=>{
    el.addEventListener("click",(e)=>{ e.stopPropagation(); const t = DB.transactions.find(x=>x.id===el.dataset.editTxn); formTransaction(t); });
  });
  document.querySelectorAll("[data-del-txn]").forEach(el=>{
    el.addEventListener("click",async (e)=>{ e.stopPropagation();
      if(confirm(L('confirm_del_txn'))){
        const { error } = await SB.from("transactions").delete().eq("id", el.dataset.delTxn);
        if(error){ toast(L('toast_sync_error')); console.error(error); return; }
        await refreshAndRender(); toast(L('toast_txn_deleted'));
      }
    });
  });
  document.querySelectorAll("[data-approve-edit]").forEach(el=>{
    el.addEventListener("click",async (e)=>{ e.stopPropagation();
      const { error } = await SB.rpc("approve_transaction_edit", { txn_id: el.dataset.approveEdit });
      if(error){ toast(L('toast_sync_error')); console.error(error); return; }
      await refreshAndRender(); toast(L('toast_edit_approved'));
    });
  });
  document.querySelectorAll("[data-reject-edit]").forEach(el=>{
    el.addEventListener("click",async (e)=>{ e.stopPropagation();
      if(!confirm(L('confirm_reject_edit'))) return;
      const { error } = await SB.rpc("reject_transaction_edit", { txn_id: el.dataset.rejectEdit });
      if(error){ toast(L('toast_sync_error')); console.error(error); return; }
      await refreshAndRender(); toast(L('toast_edit_rejected'));
    });
  });
  const editApproveFnByKind = { project:"approve_project_edit", bank:"approve_bank_account_edit", cash:"approve_cash_account_edit" };
  const editRejectFnByKind = { project:"reject_project_edit", bank:"reject_bank_account_edit", cash:"reject_cash_account_edit" };
  document.querySelectorAll("[data-approve-edit-kind]").forEach(el=>{
    el.addEventListener("click", async (e)=>{ e.stopPropagation();
      const kind = el.dataset.approveEditKind, id = el.dataset.approveEditId;
      const { error } = await SB.rpc(editApproveFnByKind[kind], { row_id: id });
      if(error){ toast(L('toast_sync_error')); console.error(error); return; }
      await refreshAndRender(); toast(L('toast_edit_approved'));
    });
  });
  document.querySelectorAll("[data-reject-edit-kind]").forEach(el=>{
    el.addEventListener("click", async (e)=>{ e.stopPropagation();
      if(!confirm(L('confirm_reject_edit'))) return;
      const kind = el.dataset.rejectEditKind, id = el.dataset.rejectEditId;
      const { error } = await SB.rpc(editRejectFnByKind[kind], { row_id: id });
      if(error){ toast(L('toast_sync_error')); console.error(error); return; }
      await refreshAndRender(); toast(L('toast_edit_rejected'));
    });
  });

  /* filters */
  ["fType","fProject","fAccType","fFrom","fTo","fQ"].forEach(id=>{
    const el = document.getElementById(id);
    if(!el) return;
    const ev = (id==='fQ')? 'input':'change';
    el.addEventListener(ev, ()=>{
      FILTERS.type = document.getElementById("fType").value;
      FILTERS.projectId = document.getElementById("fProject").value;
      FILTERS.accountType = document.getElementById("fAccType").value;
      FILTERS.from = document.getElementById("fFrom").value;
      FILTERS.to = document.getElementById("fTo").value;
      FILTERS.q = document.getElementById("fQ").value;
      render();
    });
  });
  const fClear = document.getElementById("fClear");
  if(fClear) fClear.onclick = ()=>{ FILTERS = {type:"",scope:"",projectId:"",accountType:"",accountId:"",from:"",to:"",q:""}; render(); };

  /* settings */
  const saveCompany = document.getElementById("btnSaveCompany");
  if(saveCompany) saveCompany.onclick = async ()=>{
    const name = document.getElementById("setCompanyName").value.trim() || DB.company.name;
    const tagline = document.getElementById("setCompanyTag").value.trim();
    saveCompany.disabled = true;
    const { error } = await SB.from("company").update({ name, tagline }).eq("id", 1);
    saveCompany.disabled = false;
    if(error){ toast(L('toast_sync_error')); console.error(error); return; }
    await refreshAndRender(); toast(L('toast_saved'));
  };
  const logoInput = document.getElementById("logoFileInput");
  if(logoInput) logoInput.addEventListener("change", async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    if(!file.type.startsWith("image/")){ toast(L('toast_only_images')); return; }
    if(file.size > 2*1024*1024){ toast(L('toast_image_too_big')); return; }
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      const { error } = await SB.from("company").update({ logo: ev.target.result }).eq("id", 1);
      if(error){ toast(L('toast_sync_error')); console.error(error); return; }
      await refreshAndRender(); toast(L('toast_logo_changed'));
    };
    reader.readAsDataURL(file);
  });
  const resetLogo = document.getElementById("btnResetLogo");
  if(resetLogo) resetLogo.onclick = async ()=>{
    const { error } = await SB.from("company").update({ logo: null }).eq("id", 1);
    if(error){ toast(L('toast_sync_error')); console.error(error); return; }
    await refreshAndRender(); toast(L('toast_logo_reset'));
  };
  const changeDb = document.getElementById("btnChangeDbConnection");
  if(changeDb) changeDb.onclick = async ()=>{
    if(confirm(L('confirm_change_db'))){ await teardownRealtimeSync(); try{ await SB.auth.signOut(); }catch(e){} HAS_SESSION=false; CURRENT_PROFILE=null; clearSbConfig(); APP_STATE="need_config"; render(); }
  };
  const resetAll = document.getElementById("btnResetAll");
  if(resetAll) resetAll.onclick = async ()=>{
    if(!isAdmin()) return;
    if(confirm(L('confirm_reset_all_1'))){
      if(confirm(L('confirm_reset_all_2'))){
        resetAll.disabled = true;
        await Promise.all([
          SB.from("transactions").delete().neq("id","00000000-0000-0000-0000-000000000000"),
          SB.from("projects").delete().neq("id","00000000-0000-0000-0000-000000000000"),
          SB.from("bank_accounts").delete().neq("id","00000000-0000-0000-0000-000000000000"),
          SB.from("cash_accounts").delete().neq("id","00000000-0000-0000-0000-000000000000")
        ]);
        resetAll.disabled = false;
        navigate("dashboard"); await refreshAndRender(); toast(L('toast_all_data_deleted'));
      }
    }
  };
  ["income","expense"].forEach(kind=>{
    const addBtn = document.getElementById(kind==='income'?"addIncomeCat":"addExpenseCat");
    if(addBtn) addBtn.onclick = async ()=>{
      const inp = document.getElementById(kind==='income'?"newIncomeCat":"newExpenseCat");
      const v = inp.value.trim();
      if(v && !DB.categories[kind].includes(v)){
        const { error } = await SB.from("categories").insert({ kind, name:v });
        if(error){ toast(L('toast_sync_error')); console.error(error); return; }
        await refreshAndRender(); toast(L('toast_category_added'));
      }
    };
  });
  document.querySelectorAll("[data-del-cat]").forEach(el=>{
    el.addEventListener("click",async ()=>{
      const [kind,cat] = el.dataset.delCat.split(":");
      const { error } = await SB.from("categories").delete().eq("kind",kind).eq("name",cat);
      if(error){ toast(L('toast_sync_error')); console.error(error); return; }
      await refreshAndRender();
    });
  });

  /* export snapshot */
  const doExport = ()=>{
    const blob = new Blob([JSON.stringify(DB,null,2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `GPE_Accounts_Backup_${todayStr()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    toast(L('toast_backup_downloaded'));
  };
  const be1 = document.getElementById("btnExport"); if(be1) be1.onclick = doExport;
  const be2 = document.getElementById("btnExport2"); if(be2) be2.onclick = doExport;

  const be3 = document.getElementById("btnExcelExport"); if(be3) be3.onclick = exportAllReportsExcel;
  const be4 = document.getElementById("btnExcelExport2"); if(be4) be4.onclick = exportAllReportsExcel;
  const be5 = document.getElementById("btnExcelExport3"); if(be5) be5.onclick = exportAllReportsExcel;

  /* auth: logout */
  const logoutBtn = document.getElementById("btnLogout");
  if(logoutBtn) logoutBtn.onclick = async ()=>{
    await teardownRealtimeSync();
    try{ await SB.auth.signOut(); }catch(e){}
    HAS_SESSION = false; CURRENT_PROFILE = null;
    navigate("dashboard");
  };

  /* auth: change own password */
  const cpBtn = document.getElementById("btnChangePassword");
  if(cpBtn) cpBtn.onclick = async ()=>{
    const me = currentUser();
    if(!me) return;
    const cur = document.getElementById("cpCurrent").value;
    const p1 = document.getElementById("cpNew").value;
    const p2 = document.getElementById("cpConfirm").value;
    if(!cur || !p1 || !p2){ toast(L('auth_toast_fields_required')); return; }
    if(p1.length<4){ toast(L('auth_toast_password_min')); return; }
    if(p1!==p2){ toast(L('auth_toast_password_mismatch')); return; }
    cpBtn.disabled = true;
    const email = usernameToEmail(me.username);
    const { error: verifyErr } = await SB.auth.signInWithPassword({ email, password: cur });
    if(verifyErr){ cpBtn.disabled=false; toast(L('toast_current_password_wrong')); return; }
    const { error } = await SB.auth.updateUser({ password: p1 });
    cpBtn.disabled = false;
    if(error){ toast(L('toast_sync_error')); console.error(error); return; }
    toast(L('toast_password_changed'));
  };

  /* users management (admin only) */
  const createUserBtn = document.getElementById("btnCreateUser");
  if(createUserBtn) createUserBtn.onclick = async ()=>{
    const username = document.getElementById("nuUsername").value.trim();
    const pass = document.getElementById("nuPassword").value;
    const role = document.getElementById("nuRole").value;
    const adminPass = document.getElementById("nuAdminPassword").value;
    const me = currentUser();
    if(!username || !pass || !adminPass){ toast(L('auth_toast_fields_required')); return; }
    if(pass.length<4){ toast(L('auth_toast_password_min')); return; }
    if(DB.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){ toast(L('toast_username_taken')); return; }
    if(!me){ return; }
    createUserBtn.disabled = true;

    const newEmail = usernameToEmail(username);
    const { data: signUpData, error: signUpErr } = await SB.auth.signUp({ email:newEmail, password:pass });
    if(signUpErr || !signUpData.user){
      createUserBtn.disabled = false; toast(L('toast_sync_error')); console.error(signUpErr); return;
    }
    const { error: profErr } = await SB.from("profiles").insert({ id: signUpData.user.id, username, role:"user", created_by: me.username });

    const adminEmail = usernameToEmail(me.username);
    const { error: reAuthErr } = await SB.auth.signInWithPassword({ email:adminEmail, password:adminPass });
    if(reAuthErr){
      // couldn't restore admin session (wrong password re-entered) — resync from whatever session is now active
      createUserBtn.disabled = false;
      toast(L('toast_wrong_own_password'));
      await boot();
      return;
    }
    let promoteErr = null;
    if(role==='admin'){
      ({error: promoteErr} = await SB.from("profiles").update({ role:'admin', updated_by: me.username }).eq('id', signUpData.user.id));
    }
    createUserBtn.disabled = false;
    if(profErr || promoteErr){ toast(L('toast_sync_error')); console.error(profErr||promoteErr); }
    await refreshAndRender(); toast(L('toast_user_created'));
  };
  document.querySelectorAll("[data-toggle-user]").forEach(el=>{
    el.addEventListener("click",async ()=>{
      const u = DB.users.find(x=>x.id===el.dataset.toggleUser);
      if(!u) return;
      const me = currentUser();
      if(me && me.id===u.id){ toast(L('toast_cannot_delete_self')); return; }
      const willDisable = !u.disabled;
      if(willDisable && u.role==='admin' && DB.users.filter(x=>x.role==='admin' && !x.disabled).length<=1){ toast(L('toast_cannot_delete_last_admin')); return; }
      if(willDisable && !confirm(L('confirm_delete_user'))) return;
      const { error } = await SB.from("profiles").update({ disabled: willDisable, updated_by: me?me.username:null }).eq("id", u.id);
      if(error){ toast(L('toast_sync_error')); console.error(error); return; }
      await refreshAndRender(); toast(willDisable? L('toast_user_deleted') : L('toast_user_enabled'));
    });
  });
}

boot();
</script>
</body>
</html>
